name: Build FMR dB Meter v0.3

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Add APK and checksum
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/FMR_dB_Meter_v0.3.apk
          sha256sum dist/FMR_dB_Meter_v0.3.apk > dist/FMR_dB_Meter_v0.3.apk.sha256

      - name: Commit APK and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/bootstrap.yml
          rmdir --ignore-fail-on-non-empty .github/workflows .github || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add FMR dB Meter v0.3 APK"
          git push
